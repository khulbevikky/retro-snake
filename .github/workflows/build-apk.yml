name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          # Use pre-installed NDK on the GitHub Actions runner
          NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_DIR" ]; then
            echo "Installing NDK via sdkmanager..."
            yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
            $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "ndk-bundle" "platforms;android-34" "build-tools;34.0.0"
            NDK_DIR=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Install and Initialize Go Mobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Init gomobile
        run: |
          gomobile init

      - name: Fetch Mobile Dependencies
        run: |
          go get golang.org/x/mobile/app@latest
          go mod tidy

      - name: Build Android APK
        run: |
          gomobile build -target=android -androidapi 34 -o retro-snake.apk .

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: retro-snake
          path: retro-snake.apk

